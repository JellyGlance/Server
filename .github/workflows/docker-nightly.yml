name: JellyGlance Nightly Image

on:
  schedule:
    # ≈19:00 Europe/London (18:00 UTC during BST; 19:00 GMT in winter)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Image repo this workflow publishes to.
  IMAGE_NAME: ghcr.io/jellyglance/server

concurrency:
  group: jellyglance-nightly-image
  cancel-in-progress: false

jobs:
  nightly:
    name: "JellyGlance Nightly · GHCR"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly image (if present)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PACKAGE="server"
          echo "Looking for existing 'nightly' tag on ghcr.io/${OWNER,,}/${PACKAGE}..."

          # Org-owned package (ghcr.io/jellyglance/server); fall back to the user API.
          list_versions() {
            gh api --paginate "/orgs/${OWNER}/packages/container/${PACKAGE}/versions" 2>/dev/null \
              || gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE}/versions" 2>/dev/null \
              || true
          }

          mapfile -t IDS < <(list_versions | jq -r '
            .[]?
            | select(.metadata.container.tags[]? == "nightly")
            | .id
          ' | sort -u)

          if [ "${#IDS[@]}" -eq 0 ] || [ -z "${IDS[0]:-}" ]; then
            echo "No existing nightly tag found; nothing to delete."
            exit 0
          fi

          for id in "${IDS[@]}"; do
            echo "Deleting package version id=${id} (tagged nightly)..."
            gh api -X DELETE "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${id}" 2>/dev/null \
              || gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE}/versions/${id}" 2>/dev/null \
              || echo "Warning: could not delete version ${id} (continuing)"
          done

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Pull Docker Hub base images through Google's public mirror first. It is
          # unauthenticated and not subject to Docker Hub's anonymous pull limits,
          # which is what made fork PR builds fail with 429s.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
          labels: |
            org.opencontainers.image.title=JellyGlance Nightly
            org.opencontainers.image.description=Nightly build from main

      - name: Build and push nightly image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
