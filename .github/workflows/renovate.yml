# Dependency updates via Renovate, authored by JellyGlance Security Bot.
# Replaces Dependabot so update PRs are opened by our GitHub App: their
# checks then get normal Actions secrets (Dependabot PRs only see the
# empty Dependabot secret store).
#
# Needs SECURITY_BOT_APP_ID / SECURITY_BOT_PRIVATE_KEY, and the Security Bot
# app installed on this repo with read & write on Contents, Pull requests,
# Issues (dependency dashboard) and Workflows (to bump action versions).
name: Renovate (Security Bot)

on:
  schedule:
    # 09:00 Europe/London during BST (cron is UTC). Adjust to 09:00 UTC in winter if wanted.
    - cron: "0 8 * * *"
  # Ticking a checkbox on the Dependency Dashboard only edits the issue body;
  # Renovate acts on it the next time it runs. Run straight away instead of
  # waiting for the daily schedule.
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options: [info, debug]

permissions:
  contents: read

jobs:
  renovate:
    # For issue edits, only react to a person ticking a box on the dashboard.
    # Renovate rewrites the dashboard itself on every run; ignoring bot edits
    # stops it from re-triggering itself in a loop.
    if: >-
      github.event_name != 'issues' || (
        github.event.issue.title == 'Dependency Dashboard' &&
        github.event.issue.user.type == 'Bot' &&
        github.event.sender.type != 'Bot' &&
        contains(github.event.issue.body, '- [x] ')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level so skipped runs (edits to other issues) never take the slot.
    # One Renovate run at a time; a queued run is replaced by a newer one,
    # which is fine because every run reads the current dashboard state.
    concurrency:
      group: renovate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mint JellyGlance Security Bot token
        id: bot
        uses: ./.github/actions/mint-bot-token
        with:
          bot-name: JellyGlance Security Bot
          app-id: ${{ secrets.SECURITY_BOT_APP_ID }}
          private-key: ${{ secrets.SECURITY_BOT_PRIVATE_KEY }}

      # Never fall back to github-actions[bot]: PRs opened with GITHUB_TOKEN
      # don't trigger other workflows, which defeats the point.
      - name: Require Security Bot token
        if: steps.bot.outputs.using-bot != 'true'
        run: |
          echo "::error::JellyGlance Security Bot credentials missing or invalid; refusing to run Renovate as github-actions[bot]."
          exit 1

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.bot.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM_COMMIT: "enabled"
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
