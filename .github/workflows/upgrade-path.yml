name: Upgrade path

# Starts the latest published release on a fresh database, seeds it like a real
# install (env bootstrap admin, media server, SMTP password under the old
# crypto-js encryption), then starts this commit's image on the same database
# and checks login, config, media server requests and SMTP decrypt.
#
# Uses public images only and no secrets, so it runs the same on fork PRs.

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "scripts/entrypoint.sh"
      - "scripts/upgrade-test/**"
      - ".github/workflows/upgrade-path.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      old_image:
        description: Release image to upgrade from
        required: false
        default: ghcr.io/jellyglance/server:latest

permissions:
  contents: read

concurrency:
  group: upgrade-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade from latest release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build image under test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: jellyglance:upgrade-test
          cache-from: type=gha,scope=docker-linux/amd64

      - name: Run upgrade-path test
        env:
          OLD_IMAGE: ${{ inputs.old_image || 'ghcr.io/jellyglance/server:latest' }}
          NEW_IMAGE: jellyglance:upgrade-test
        run: ./scripts/upgrade-test/run.sh
