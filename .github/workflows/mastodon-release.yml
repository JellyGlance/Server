name: Notify / Mastodon Release

on:
  # Post only after the release pipeline has built and pushed the images, so
  # nobody pulls a tag that doesn't exist yet. A failed or cancelled pipeline
  # never posts.
  workflow_run:
    workflows: ["JellyGlance Release Bot"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce (optional)
        required: false

permissions:
  contents: read

jobs:
  post:
    name: Publish Mastodon release post
    # Only a successful pipeline run started by a published release (head_branch is
    # then the tag). Manual image rebuilds of an old tag don't post again; use
    # workflow_dispatch here for that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the release via gh api
      packages: read # confirm the image tag exists on ghcr.io
    env:
      IMAGE_NAME: ghcr.io/jellyglance/server

    steps:
      - name: Resolve release details
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ github.event.workflow_run.head_branch || github.event.inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const output = (name, value) => {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}<<EOF\n${value || ""}\nEOF\n`);
          };

          let release;
          const repo = process.env.REPO;
          const workflowHeadSha = process.env.WORKFLOW_HEAD_SHA || "";
          const inputTag = process.env.INPUT_TAG || "";

          if (inputTag) {
            release = JSON.parse(
              execFileSync("gh", ["api", `repos/${repo}/releases/tags/${inputTag}`], { encoding: "utf8" })
            );
          } else if (process.env.EVENT_NAME === "workflow_run") {
            const releases = JSON.parse(
              execFileSync("gh", ["api", `repos/${repo}/releases`], { encoding: "utf8" })
            );
            release = releases.find((candidate) => candidate.target_commitish === workflowHeadSha);
            if (!release && releases.length) {
              console.log(`::notice::No matching release for commit ${workflowHeadSha}; falling back to latest release.`);
              release = releases[0];
            }
          } else {
            release = JSON.parse(
              execFileSync("gh", ["api", `repos/${repo}/releases/latest`], { encoding: "utf8" })
            );
          }

          if (!release.tag_name || !release.html_url) {
            throw new Error("Unable to resolve the release to post.");
          }

          output("name", release.name || `JellyGlance ${release.tag_name}`);
          output("tag", release.tag_name);
          output("body", release.body || "");
          output("url", release.html_url);
          NODE

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm the release image is published
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}" >/dev/null
          echo "Found ${IMAGE_NAME}:${TAG}"

      - name: Create Mastodon status
        env:
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          MASTODON_MAX_CHARS: ${{ vars.MASTODON_MAX_CHARS || '500' }}
        run: |
          python3 <<'PY'
          import os

          release_name = (os.environ.get("RELEASE_NAME") or "").strip()
          release_tag = (os.environ.get("RELEASE_TAG") or "").strip()
          release_body = (os.environ.get("RELEASE_BODY") or "").strip()
          release_url = (os.environ.get("RELEASE_URL") or "").strip()
          max_chars = int(os.environ.get("MASTODON_MAX_CHARS") or "500")

          title = release_name or f"JellyGlance {release_tag}"
          body_lines = [line.strip() for line in release_body.splitlines() if line.strip()]
          highlights = []

          for line in body_lines:
            if line.startswith(("-", "*")):
              highlights.append(f"- {line.lstrip('-* ').strip()}")
            if len(highlights) == 4:
              break

          if highlights:
            summary = "\n".join(highlights)
          else:
            summary = "Fresh JellyGlance release with the latest fixes, polish, and media-server improvements."

          status = f"{title} is out.\n\n{summary}\n\n{release_url}"

          if len(status) > max_chars:
            suffix = f"\n\n{release_url}"
            available = max(0, max_chars - len(suffix) - 3)
            status = status[:available].rstrip() + "..." + suffix

          with open("mastodon-status.txt", "w", encoding="utf-8") as handle:
            handle.write(status)
          PY

      - name: Post to Mastodon
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ vars.MASTODON_INSTANCE_URL || secrets.MASTODON_INSTANCE_URL }}
          MASTODON_STATUS_VISIBILITY: ${{ vars.MASTODON_STATUS_VISIBILITY || 'public' }}
          MASTODON_LANGUAGE: ${{ vars.MASTODON_LANGUAGE || 'en' }}
        run: |
          if [ -z "${MASTODON_ACCESS_TOKEN}" ] || [ -z "${MASTODON_INSTANCE_URL}" ]; then
            echo "::warning::Skipping Mastodon post because MASTODON_ACCESS_TOKEN or MASTODON_INSTANCE_URL is not configured."
            exit 0
          fi

          instance="${MASTODON_INSTANCE_URL%/}"

          curl --fail --show-error --silent \
            --request POST "${instance}/api/v1/statuses" \
            --header "Authorization: Bearer ${MASTODON_ACCESS_TOKEN}" \
            --data-urlencode "status@mastodon-status.txt" \
            --data-urlencode "visibility=${MASTODON_STATUS_VISIBILITY}" \
            --data-urlencode "language=${MASTODON_LANGUAGE}"
