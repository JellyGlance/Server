name: JellyGlance Release Bot

# Releases are published by hand from the GitHub Releases page (using the
# Release Drafter draft). Publishing a release triggers this workflow, which
# stamps the release version into the package files, builds the app and pushes
# the Docker images. The Discord announcement runs after this workflow succeeds
# (workflow_run), so it only goes out once the images exist. Mastodon still runs
# on the "release published" event.
#
# What's New (apps/web/src/whats-new.json) is bundled into the image, so merge
# it into main before publishing the release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build images for, for example v1.2.11
        required: true

permissions:
  contents: read

concurrency:
  group: file-release
  cancel-in-progress: false

env:
  # Image repo this workflow publishes to.
  IMAGE_NAME: ghcr.io/jellyglance/server

jobs:
  release:
    name: "JellyGlance Release Bot · Pipeline"
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the release via gh api and check out the tag
      packages: write # push images to ghcr.io/jellyglance/server

    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const tag = String(process.env.RELEASE_TAG || "").trim();
          if (!tag) {
            throw new Error("No release tag was provided.");
          }

          const release = JSON.parse(
            execFileSync("gh", ["api", `repos/${process.env.REPO}/releases/tags/${tag}`], { encoding: "utf8" })
          );
          if (release.draft) {
            throw new Error(`Release ${tag} is still a draft. Publish it first.`);
          }

          const version = tag.replace(/^v/i, "");
          const semver = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          if (!semver.test(version)) {
            throw new Error(`Release tag ${tag} is not a valid semver tag, for example v1.2.11`);
          }

          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`version=${version}\n`);
          output.write(`tag=${tag}\n`);
          output.write(`is_beta=${release.prerelease ? "true" : "false"}\n`);
          output.end();
          console.log(`Building ${tag}${release.prerelease ? " (pre-release)" : ""}`);
          NODE

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Apply release version to package files
        run: npm version "${{ steps.release.outputs.version }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Verify package versions
        run: |
          node <<'NODE'
          const fs = require("fs");

          const expected = "${{ steps.release.outputs.version }}";
          const packageFiles = [
            "package.json",
            "apps/api/package.json",
            "apps/web/package.json",
          ];

          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== expected) {
              throw new Error(`${file} is ${pkg.version}, expected ${expected}`);
            }
          }

          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockPackages = {
            "package-lock root": lock,
            "package-lock packages root": lock.packages?.[""],
            "package-lock apps/api": lock.packages?.["apps/api"],
            "package-lock apps/web": lock.packages?.["apps/web"],
          };

          for (const [name, pkg] of Object.entries(lockPackages)) {
            if (!pkg) {
              throw new Error(`${name} is missing`);
            }
            if (pkg.version !== expected) {
              throw new Error(`${name} is ${pkg.version}, expected ${expected}`);
            }
          }

          console.log(`All package versions match ${expected}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Report build-local package version changes
        run: |
          git add package.json package-lock.json apps/*/package.json
          if git diff --cached --quiet; then
            echo "Package files already match ${{ steps.release.outputs.version }}"
          else
            echo "::notice::Package files were updated locally for this release build only. Protected branches are not modified by the release workflow."
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          # Pull Docker Hub base images through Google's public mirror first. It is
          # unauthenticated and not subject to Docker Hub's anonymous pull limits,
          # which is what made fork PR builds fail with 429s.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # GITHUB_TOKEN (packages: write) can push to the org package
          # ghcr.io/jellyglance/server from JellyGlance/Server. Git push/tag still use the Release Bot.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_beta != 'true' }}
            type=raw,value=main,enable=${{ steps.release.outputs.is_beta != 'true' }}
            type=raw,value=beta,enable=${{ steps.release.outputs.is_beta == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

