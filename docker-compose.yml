services:
  jellyglance-db:
    image: postgres:18-alpine
    container_name: jellyglance-db
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: jellyglance
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=jellyglance --username=postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellyglance:
    image: ghcr.io/jellyglance/server:latest
    container_name: jellyglance
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_IP: jellyglance-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: jellyglance
      JWT_SECRET: "replace-me-with-a-long-random-secret"
      TZ: Europe/London
      CONFIG_DIR: /app/config
      BACKUP_DIR: /app/backups
      # Optional first-run bootstrap (uncomment to skip the setup wizard):
      # JF_HOST: https://jellyfin.example.com
      # JF_API_KEY: your-jellyfin-api-key
      # JS_AUTH_MODE: local
      # JS_USER: admin
      # JS_PASSWORD: choose-a-strong-password
      # JS_SKIP_FIRST_RUN: "true"
      # JS_AUTO_START_SYNC: "true"
    volumes:
      - ./config:/app/config
      - ./backups:/app/backups
    ports:
      - "3000:3000"
    depends_on:
      jellyglance-db:
        condition: service_healthy


