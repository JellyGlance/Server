<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1117" />
<title>JellyGlance is offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1117; color: #e6edf7; font-family: system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.3rem; margin: 18px 0 8px; }
  p { color: #9fb0c8; line-height: 1.5; }
  button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 10px; background: #8b5cf6; color: #fff; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="" />
  <h1>Can't reach JellyGlance</h1>
  <p>Your device is offline or the server isn't responding. Check your connection and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
