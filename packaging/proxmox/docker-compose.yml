# Unraid: place under /mnt/user/appdata/jellyglance/ and run with Docker Compose Manager
# or: docker compose -f /mnt/user/appdata/jellyglance/docker-compose.yml up -d
services:
  jellyglance-db:
    image: postgres:16-alpine
    container_name: jellyglance-db
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jellyglance}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=$${POSTGRES_DB:-jellyglance} --username=$${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  jellyglance:
    image: ghcr.io/jellyglance/server:latest
    container_name: jellyglance
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_IP: jellyglance-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jellyglance}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      TZ: ${TZ:-Europe/London}
      CONFIG_DIR: /app/config
      BACKUP_DIR: /app/backups
    volumes:
      - ./config:/app/config
      - ./backups:/app/backups
    ports:
      - "${WEBUI_PORT:-3000}:3000"
    depends_on:
      jellyglance-db:
        condition: service_healthy
